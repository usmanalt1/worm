  "dbt-postgres==1.11.0",
  "dj-database-url==3.1.2",
  "django==5.2.19",
  "django-cors-headers==4.9.0",
  "django-ninja==1.8.0",
  "django-ninja-jwt==5.4.5",
  "duckdb==2.0.0",
  "fastparquet==2026.9.0",
  "flask==3.1.3",
  "fsspec==2026.9.0",
  "gcsfs==2026.10.1",
  "google-cloud-bigquery==3.47.0",
  "google-cloud-storage==3.17.1",
