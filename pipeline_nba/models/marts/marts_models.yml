version: 2

models:
  - name: dim_players
    config:
      materialized: table
      on_schema_change: append_new_columns
    alias: dim_players
    description: "This table contains dimension data for NBA players, including player information and statistics."
  - name: mart_team_schedule_load
    config:
      materialized: table
      on_schema_change: append_new_columns
    alias: mart_team_schedule_load
    description: >
      Travel and schedule load per team-game, from dim_games and the team_locations seed.
      travel_km, tz_delta and altitude_gain are measured against the team's previous
      venue and are 0 on its first game of a season. road_trip_game is 0 at home and n on
      the nth consecutive away game.
    columns:
      - name: team_id
        data_tests: [not_null]
      - name: game_id
        data_tests: [not_null]
      - name: travel_km
        data_tests: [not_null]
      - name: games_prev_7d
        data_tests: [not_null]
  - name: dim_draft_picks
    config:
      materialized: table
      on_schema_change: append_new_columns
    alias: dim_draft_picks
    description: >
      One row per drafted player with pick position and pedigree flags. draft_year is the
      draft; season is the one it fed. Undrafted players have no row.
    columns:
      - name: player_id
        data_tests: [not_null, unique]
      - name: overall_pick
        data_tests: [not_null]
  - name: dim_teams
    config:
      materialized: table
      on_schema_change: append_new_columns
    alias: dim_teams
    description: "This table contains dimension data for NBA teams, including team information and statistics."
  - name: dim_games
    config:
      materialized: table
      on_schema_change: append_new_columns
    alias: dim_games
    description: "This table contains dimension data for NBA games, including game information and statistics."
  - name: dim_seasons
    config:
      materialized: table
      on_schema_change: append_new_columns
    alias: dim_seasons
    description: "This table contains dimension data for NBA seasons, including season information and statistics."
  - name: dim_rosters
    config:
      on_schema_change: append_new_columns
    alias: dim_rosters
    description: "This table contains dimension data for NBA rosters, including roster information and statistics."
    alias: dim_rosters
    description: "This table contains dimension data for NBA rosters, including roster information and statistics."
  - name: fct_player_stats
    config:
      materialized: incremental
      unique_key: ["season_id", "player_id", "team_id", "game_id"]
      incremental_strategy: merge
      on_schema_change: append_new_columns
    alias: fct_player_stats
    description: "This table contains fact data for NBA player statistics, including performance metrics for each player in each game."
  - name: fct_team_stats
    config:
      materialized: incremental
      unique_key: ["season_id", "team_id", "game_id"]
      incremental_strategy: merge
      on_schema_change: append_new_columns
    alias: fct_team_stats
    description: "This table contains fact data for NBA team statistics, including performance metrics for each team in each game."
  - name: mart_player_game_form
    config:
      materialized: table
      on_schema_change: append_new_columns
    alias: mart_player_game_form
    description: >
      Per player-game rolling form. form_* is the last 10 games up to and including this
      one; base_* is every earlier game, stopping 10 short so the two never overlap.
      delta_* is form minus baseline - the hot/cold measure. Rows before game 11 have a
      null baseline. Partitioned on player alone, so a traded player keeps one season.
    columns:
      - name: player_id
        data_tests: [not_null]
      - name: game_id
        data_tests: [not_null]
      - name: game_date
        data_tests: [not_null]
      - name: games_in_season
        data_tests: [not_null]
  - name: mart_team_game_form
    config:
      materialized: table
      on_schema_change: append_new_columns
    alias: mart_team_game_form
    description: >
      Per team-game rolling form, same windows as mart_player_game_form. margin is the
      team log's plus_minus. form_win_pct and base_win_pct are 0-100.
    columns:
      - name: team_id
        data_tests: [not_null]
      - name: game_id
        data_tests: [not_null]
      - name: game_date
        data_tests: [not_null]
      - name: margin
        data_tests: [not_null]
