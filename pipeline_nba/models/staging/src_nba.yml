version: 2

sources:
  - name: nba_dataset
    description: "Source data for NBA statistics"
    schema: "{{ 'test' if target.name == 'local' else 'public' }}"
    tables:
      - name: player_stats
        description: "Raw data of NBA players"
      - name: players_info
        description: "Raw data of NBA player information"
      - name: team_stats
        description: "Raw data of NBA teams"
      - name: season_record
        description: "Raw data of NBA season records"
      - name: teams_info
        description: "Raw data of NBA team information"
      - name: teams_roster
        description: "Raw data of NBA team rosters"
      - name: team_info
        description: "Backward-compatible alias for teams_info"
        identifier: teams_info
      - name: player_info
        description: "Backward-compatible alias for players_info"
        identifier: players_info
      - name: player_awards
        description: "Table contining information about player_awards"
        identifier: player_awards
      - name: game_schedule
        description: "Full-season game schedule, including games that haven't been played yet"
      - name: draft_history
        description: "Every NBA draft pick, backfilled per draft year; immutable once held"
      - name: advanced_player_season_stats
        description: "Season-level advanced stats per player (leaguedashplayerstats, MeasureType=Advanced)"
      - name: advanced_team_season_stats
        description: "Season-level advanced stats per team (leaguedashteamstats, MeasureType=Advanced)"
